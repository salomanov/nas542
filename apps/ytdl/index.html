<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Загрузчик медиа • NAS542</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --card-border: #334155;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --success: #10b981;
      --danger: #ef4444;
      --radius: 12px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 16px; min-height: 100vh; display: flex; flex-direction: column; align-items: center; }
    .container { width: 100%; max-width: 680px; display: flex; flex-direction: column; gap: 16px; margin-top: 10px; }
    header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 8px; border-bottom: 1px solid var(--card-border); }
    .brand { display: flex; align-items: center; gap: 10px; }
    .brand-icon { font-size: 24px; }
    .brand-title { font-size: 18px; font-weight: 700; color: #fff; }
    .brand-sub { font-size: 12px; color: var(--text-muted); }
    .nav-links { display: flex; gap: 12px; }
    .nav-link { color: var(--accent); text-decoration: none; font-size: 13px; font-weight: 500; transition: color 0.2s; }
    .nav-link:hover { color: #fff; text-decoration: underline; }
    .card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: var(--radius); padding: 20px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.2); }
    .card-title { font-size: 15px; font-weight: 600; margin-bottom: 14px; display: flex; align-items: center; gap: 8px; }
    .input-group { display: flex; flex-direction: column; gap: 12px; }
    .url-input-wrap { position: relative; width: 100%; }
    input[type="text"] { width: 100%; background: #0f172a; border: 1px solid var(--card-border); border-radius: 8px; padding: 12px 14px; color: #fff; font-size: 14px; outline: none; transition: border-color 0.2s; }
    input[type="text"]:focus { border-color: var(--accent); }
    .format-pills { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .format-pill { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 10px; background: #0f172a; border: 1px solid var(--card-border); border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 500; transition: all 0.2s; user-select: none; }
    .format-pill input { display: none; }
    .format-pill.active { background: rgba(56, 189, 248, 0.15); border-color: var(--accent); color: var(--accent); }
    .btn-submit { background: var(--accent); color: #0f172a; border: none; border-radius: 8px; padding: 14px; font-size: 15px; font-weight: 700; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 8px; transition: background 0.2s; margin-top: 4px; }
    .btn-submit:hover { background: var(--accent-hover); color: #fff; }
    .btn-submit:disabled { opacity: 0.5; cursor: not-allowed; }
    
    /* Progress Card */
    .progress-card { display: none; border-color: var(--accent); }
    .progress-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .progress-badge { font-size: 12px; font-weight: 600; padding: 3px 8px; border-radius: 12px; background: rgba(56,189,248,0.2); color: var(--accent); }
    .progress-badge.completed { background: rgba(16,185,129,0.2); color: var(--success); }
    .progress-badge.error { background: rgba(239,68,68,0.2); color: var(--danger); }
    .progress-bar-bg { width: 100%; height: 10px; background: #0f172a; border-radius: 5px; overflow: hidden; margin-bottom: 10px; }
    .progress-bar-fill { width: 0%; height: 100%; background: linear-gradient(90deg, #38bdf8, #818cf8); transition: width 0.3s ease; }
    .progress-stats { display: flex; justify-content: space-between; font-size: 12px; color: var(--text-muted); }
    .log-toggle { font-size: 12px; color: var(--accent); background: none; border: none; cursor: pointer; margin-top: 10px; }
    .log-box { display: none; background: #090d16; border-radius: 6px; padding: 10px; font-family: monospace; font-size: 11px; color: #cbd5e1; max-height: 140px; overflow-y: auto; margin-top: 8px; white-space: pre-wrap; word-break: break-all; }

    /* Files List */
    .files-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .files-list { display: flex; flex-direction: column; gap: 8px; max-height: 350px; overflow-y: auto; }
    .file-item { display: flex; justify-content: space-between; align-items: center; background: #0f172a; padding: 10px 14px; border-radius: 8px; border: 1px solid #1e293b; gap: 10px; }
    .file-info { min-width: 0; flex: 1; }
    .file-name { font-size: 13px; font-weight: 500; color: #e2e8f0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .file-meta { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
    .file-actions { display: flex; gap: 8px; }
    .btn-icon { background: #1e293b; border: 1px solid #334155; color: #94a3b8; border-radius: 6px; padding: 6px 10px; font-size: 12px; cursor: pointer; text-decoration: none; display: flex; align-items: center; }
    .btn-icon:hover { color: #fff; border-color: var(--accent); }
    .btn-delete:hover { border-color: var(--danger); color: var(--danger); }
    .empty-state { text-align: center; padding: 20px; color: var(--text-muted); font-size: 13px; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="brand">
        <span class="brand-icon">📥</span>
        <div>
          <div class="brand-title">Загрузчик медиа</div>
          <div class="brand-sub">ZyXEL NAS542 • yt-dlp</div>
        </div>
      </div>
      <nav class="nav-links">
        <a href="/apps/fb/" class="nav-link" target="_blank">Проводник</a>
        <a href="/apps/cops/" class="nav-link">Книги</a>
        <a href="/apps/aria/" class="nav-link">AriaNg</a>
      </nav>
    </header>

    <!-- Форма закачки -->
    <section class="card">
      <div class="card-title">🔗 Новая ссылка для скачивания</div>
      <div class="input-group">
        <div class="url-input-wrap">
          <input type="text" id="urlInput" placeholder="Вставьте ссылку на YouTube, Rutube, VK Видео или сайт...">
        </div>
        <div class="format-pills">
          <label class="format-pill active" id="pillVideo">
            <input type="radio" name="format" value="video" checked>
            🎬 Видео (MP4 FullHD)
          </label>
          <label class="format-pill" id="pillAudio">
            <input type="radio" name="format" value="audio">
            🎵 Только аудио (MP3)
          </label>
        </div>
        <button class="btn-submit" id="btnSubmit">
          <span>⬇ Скачать на диск NAS</span>
        </button>
      </div>
    </section>

    <!-- Карточка активной загрузки -->
    <section class="card progress-card" id="progressCard">
      <div class="progress-header">
        <span class="progress-title" id="jobTitle">Подготовка к загрузке...</span>
        <span class="progress-badge" id="jobBadge">Скачивание...</span>
      </div>
      <div class="progress-bar-bg">
        <div class="progress-bar-fill" id="progressBar"></div>
      </div>
      <div class="progress-stats">
        <span id="jobPercent">0%</span>
        <span id="jobSpeed">Скорость: --</span>
        <span id="jobEta">Осталось: --</span>
      </div>
      <button class="log-toggle" id="btnToggleLog">Показать консольный лог</button>
      <div class="log-box" id="logBox"></div>
    </section>

    <!-- Список скачанных файлов -->
    <section class="card">
      <div class="files-header">
        <div class="card-title" style="margin-bottom:0">📁 Скачанные видео и аудио</div>
        <button class="btn-icon" id="btnRefreshFiles" title="Обновить список">🔄 Обновить</button>
      </div>
      <div class="files-list" id="filesList">
        <div class="empty-state">Загрузка списка файлов...</div>
      </div>
    </section>
  </div>

  <script>
    const urlInput = document.getElementById('urlInput');
    const pillVideo = document.getElementById('pillVideo');
    const pillAudio = document.getElementById('pillAudio');
    const btnSubmit = document.getElementById('btnSubmit');
    const progressCard = document.getElementById('progressCard');
    const progressBar = document.getElementById('progressBar');
    const jobTitle = document.getElementById('jobTitle');
    const jobBadge = document.getElementById('jobBadge');
    const jobPercent = document.getElementById('jobPercent');
    const jobSpeed = document.getElementById('jobSpeed');
    const jobEta = document.getElementById('jobEta');
    const logBox = document.getElementById('logBox');
    const btnToggleLog = document.getElementById('btnToggleLog');
    const filesList = document.getElementById('filesList');
    const btnRefreshFiles = document.getElementById('btnRefreshFiles');

    let currentFormat = 'video';
    let pollInterval = null;
    let activeJobId = null;

    pillVideo.addEventListener('click', () => {
      pillVideo.classList.add('active');
      pillAudio.classList.remove('active');
      currentFormat = 'video';
    });

    pillAudio.addEventListener('click', () => {
      pillAudio.classList.add('active');
      pillVideo.classList.remove('active');
      currentFormat = 'audio';
    });

    btnToggleLog.addEventListener('click', () => {
      if (logBox.style.display === 'block') {
        logBox.style.display = 'none';
        btnToggleLog.innerText = 'Показать консольный лог';
      } else {
        logBox.style.display = 'block';
        btnToggleLog.innerText = 'Скрыть консольный лог';
      }
    });

    btnSubmit.addEventListener('click', async () => {
      const url = urlInput.value.trim();
      if (!url) {
        alert('Пожалуйста, вставьте ссылку!');
        urlInput.focus();
        return;
      }

      btnSubmit.disabled = true;
      btnSubmit.innerText = '⏳ Запуск задачи...';

      try {
        const resp = await fetch('api.php?action=start', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ url: url, format: currentFormat })
        });
        const res = await resp.json();

        if (res.ok) {
          activeJobId = res.jobId;
          urlInput.value = '';
          startPolling(activeJobId);
        } else {
          alert('Ошибка: ' + (res.error || 'Не удалось запустить'));
          btnSubmit.disabled = false;
          btnSubmit.innerText = '⬇ Скачать на диск NAS';
        }
      } catch (e) {
        alert('Ошибка связи с сервером: ' + e);
        btnSubmit.disabled = false;
        btnSubmit.innerText = '⬇ Скачать на диск NAS';
      }
    });

    function startPolling(jobId) {
      progressCard.style.display = 'block';
      progressBar.style.width = '0%';
      jobBadge.className = 'progress-badge';
      jobBadge.innerText = 'Скачивание...';
      jobPercent.innerText = '0%';
      jobSpeed.innerText = 'Подключение...';
      jobEta.innerText = 'Осталось: --';

      if (pollInterval) clearInterval(pollInterval);

      pollInterval = setInterval(async () => {
        try {
          const resp = await fetch('api.php?action=status&jobId=' + encodeURIComponent(jobId));
          const res = await resp.json();
          if (res.ok && res.data) {
            const d = res.data;
            if (d.title) jobTitle.innerText = d.title;
            progressBar.style.width = d.percent + '%';
            jobPercent.innerText = d.percent + '%';
            if (d.speed) jobSpeed.innerText = d.speed;
            if (d.eta) jobEta.innerText = 'Осталось: ' + d.eta;
            if (d.log) {
              logBox.innerText = d.log;
              logBox.scrollTop = logBox.scrollHeight;
            }

            if (d.status === 'completed') {
              clearInterval(pollInterval);
              jobBadge.className = 'progress-badge completed';
              jobBadge.innerText = '✔ Готово';
              progressBar.style.width = '100%';
              jobPercent.innerText = '100%';
              btnSubmit.disabled = false;
              btnSubmit.innerText = '⬇ Скачать на диск NAS';
              loadFiles();
            } else if (d.status === 'error') {
              clearInterval(pollInterval);
              jobBadge.className = 'progress-badge error';
              jobBadge.innerText = '❌ Ошибка';
              btnSubmit.disabled = false;
              btnSubmit.innerText = '⬇ Скачать на диск NAS';
              logBox.style.display = 'block';
            }
          }
        } catch (e) {
          console.error('Poll error', e);
        }
      }, 1500);
    }

    async function loadFiles() {
      try {
        const resp = await fetch('api.php?action=files');
        const res = await resp.json();
        if (res.ok && res.files) {
          if (res.files.length === 0) {
            filesList.innerHTML = '<div class="empty-state">В папке пока нет скачанных видео. Вставьте ссылку выше!</div>';
            return;
          }
          filesList.innerHTML = res.files.map(f => `
            <div class="file-item">
              <div class="file-info">
                <div class="file-name" title="${f.name}">${f.name}</div>
                <div class="file-meta">${f.size_human} • ${f.date}</div>
              </div>
              <div class="file-actions">
                <button class="btn-icon btn-delete" onclick="deleteFile('${encodeURIComponent(f.name)}')">Удалить</button>
              </div>
            </div>
          `).join('');
        }
      } catch (e) {
        filesList.innerHTML = '<div class="empty-state">Не удалось загрузить список файлов</div>';
      }
    }

    async function deleteFile(encName) {
      const name = decodeURIComponent(encName);
      if (!confirm('Удалить файл "' + name + '" с диска NAS?')) return;
      try {
        const resp = await fetch('api.php?action=delete', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ filename: name })
        });
        const res = await resp.json();
        if (res.ok) {
          loadFiles();
        } else {
          alert('Ошибка удаления: ' + (res.error || ''));
        }
      } catch (e) {
        alert('Ошибка сети: ' + e);
      }
    }

    btnRefreshFiles.addEventListener('click', loadFiles);
    loadFiles();
  </script>
</body>
</html>
