# address to listen on
ADDR="-a 0.0.0.0"

# port to listen on
PORT="-p 5007"

# database path
DB="-d __APPS__/filebrowser/filebrowser.db"

# log output
LOG="-l __APPS__/logs/filebrowser.log"

# root to prepend to relative paths
ROOT="-r __DATA__"
BASE="-b /apps/fb"

OPTIONS="$ADDR $PORT $DB $LOG $ROOT $BASE"
